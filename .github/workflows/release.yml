name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      npm_only:
        description: Publish this existing release tag to npm, without building a new release
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DRY_RUN: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.npm_only != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      upstream: ${{ steps.plan.outputs.upstream }}
      build_version: ${{ steps.build.outputs.build_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch the fnox source
        run: scripts/fetch.sh

      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-plan.mjs

      - name: Build version
        id: build
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          UPSTREAM: ${{ steps.plan.outputs.upstream }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "build_version=$UPSTREAM-dry-run.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "build_version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build_version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            src: /opt/fnox
          - platform: darwin-x64
            runner: macos-latest
            src: /opt/fnox
          - platform: linux-arm64
            runner: ubuntu-latest
            src: work/fnox
          - platform: linux-x64
            runner: ubuntu-latest
            src: work/fnox
          - platform: windows-arm64
            runner: windows-latest
            src: C:/Windows/fnox-build
          - platform: windows-x64
            runner: windows-latest
            src: C:/Windows/fnox-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      FNOX_SRC: ${{ matrix.src }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Make a build directory outside the runner's home
        if: runner.os == 'macOS'
        run: sudo mkdir -p "$FNOX_SRC" && sudo chown "$(id -un)" "$FNOX_SRC"

      - name: Select native Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $perl = (Get-Command perl.exe -ErrorAction Stop).Source
          & $perl -MLocale::Maketext::Simple -MIPC::Cmd -e 1
          if ($LASTEXITCODE -ne 0) { throw "Native Perl is missing modules required by vendored OpenSSL" }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch the fnox source
        run: scripts/fetch.sh

      - name: Install Rust
        run: rustup toolchain install

      - name: Use a cargo home outside the runner's home
        if: runner.os == 'Windows'
        run: |
          mkdir -p /c/Windows/fnox-cargo
          echo 'CARGO_HOME=C:/Windows/fnox-cargo' >> "$GITHUB_ENV"

      - name: Install cross
        if: runner.os == 'Linux'
        run: cargo install cross --locked --version 0.2.5

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ${{ matrix.src }} -> target
          key: ${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: scripts/build.sh "${{ matrix.platform }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-${{ matrix.platform }}
          path: artifacts/build/
          retention-days: 3

  test:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            ext: ''
          - platform: darwin-x64
            runner: macos-15-intel
            ext: ''
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            ext: ''
          - platform: linux-x64
            runner: ubuntu-latest
            ext: ''
          - platform: windows-arm64
            runner: windows-11-arm
            ext: .exe
          - platform: windows-x64
            runner: windows-latest
            ext: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: build-${{ matrix.platform }}
          path: artifacts/build

      - name: Trust a test CA for the proxy round trip
        run: scripts/test-tls.sh

      - name: Integration tests
        env:
          FNOX_BIN: artifacts/build/fnox-${{ matrix.platform }}${{ matrix.ext }}
          FNOX_UPSTREAM_VERSION: ${{ needs.plan.outputs.upstream }}
        run: |
          chmod +x "$FNOX_BIN"
          npm test

  release:
    needs: [plan, test]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.build_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: build-*
          merge-multiple: true
          path: artifacts/build

      - name: Fetch the fnox source
        run: scripts/fetch.sh

      - name: Package unsigned
        if: env.DRY_RUN == 'true'
        env:
          FNOX_SIGN: '0'
        run: scripts/package.sh "$VERSION"

      - name: Sign and package
        if: env.DRY_RUN != 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: scripts/package.sh "$VERSION"

      - name: Stage npm packages
        run: node scripts/npm-stage.mjs --version "$VERSION"

      - name: Check the release
        if: env.DRY_RUN == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/npm-publish.mjs --dry-run
          node scripts/release.mjs --dry-run

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fnox-release
          path: |
            artifacts/release/
            dist/npm/
          retention-days: 7

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: env.DRY_RUN != 'true'
        with:
          subject-checksums: artifacts/release/SHA256SUMS

      - name: Release
        if: env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FNOX_NPM_PUBLISH: ${{ vars.FNOX_NPM_PUBLISH }}
        run: node scripts/release.mjs

  smoke:
    needs: [plan, release]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset: fnox-darwin-arm64
          - runner: macos-15-intel
            asset: fnox-darwin-amd64
          - runner: ubuntu-latest
            asset: fnox-linux-amd64
          - runner: ubuntu-24.04-arm
            asset: fnox-linux-arm64
          - runner: windows-latest
            asset: fnox-windows-amd64.exe
          - runner: windows-11-arm
            asset: fnox-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: fnox-release

      - name: Run the signed binary
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          UPSTREAM: ${{ needs.plan.outputs.upstream }}
        run: |
          cd artifacts/release
          grep " $ASSET\$" SHA256SUMS > one.sum
          if command -v sha256sum >/dev/null; then sha256sum -c one.sum; else shasum -a 256 -c one.sum; fi
          chmod +x "$ASSET"
          out="$("./$ASSET" --version)"
          echo "$out"
          test "$out" = "fnox $UPSTREAM"

      - name: Check the macOS signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          cd artifacts/release
          codesign --verify --strict --verbose=2 "$ASSET"
          details="$(codesign -dv --verbose=4 "$ASSET" 2>&1)"
          echo "$details"
          grep -q '^Identifier=ai.sliccy.fnox$' <<< "$details"
          grep -q '^Authority=Developer ID Application:' <<< "$details"
          grep -q 'flags=.*runtime' <<< "$details"
          grep -q '^Timestamp=' <<< "$details"

  npm-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_only != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.npm_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.npm_only }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts/release
          (cd artifacts/release && sha256sum -c SHA256SUMS)
          scripts/fetch.sh
          cp work/fnox/LICENSE artifacts/release/LICENSE

      - name: Publish to npm
        env:
          FNOX_NPM_PUBLISH: ${{ vars.FNOX_NPM_PUBLISH }}
        run: |
          node scripts/npm-stage.mjs --version "${TAG#v}"
          node scripts/npm-publish.mjs
